AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: 'BANCOW - Application Infrastructure Root (SAM) - Consumes CDK base resources'

Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, uat, prod]
    Description: Environment name
  ProjectName:
    Type: String
    Default: bancow
    Description: Project name for resource naming

# This template uses nested stacks to organize application resources
# All base infrastructure (VPC, IAM, S3, KMS) is consumed from SSM parameters
# published by the CDK base stack

Resources:
  # Application Stack: Lambda functions
  AppStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ./app.yaml
      Parameters:
        Environment: !Ref Environment
        ProjectName: !Ref ProjectName
        # Consume network resources from SSM
        VpcId: !Sub '{{resolve:ssm:/${ProjectName}/${Environment}/network/vpc-id}}'
        PrivateSubnetIds: !Sub '{{resolve:ssm:/${ProjectName}/${Environment}/network/private-subnet-ids}}'
        LambdaSecurityGroupId: !Sub '{{resolve:ssm:/${ProjectName}/${Environment}/network/lambda-sg-id}}'
        # Consume IAM resources from SSM
        LambdaExecutionRoleArn: !Sub '{{resolve:ssm:/${ProjectName}/${Environment}/iam/lambda-execution-role-arn}}'
        # Consume S3 resources from SSM
        ArtifactsBucketName: !Sub '{{resolve:ssm:/${ProjectName}/${Environment}/s3/artifacts-bucket-name}}'
        LogsBucketName: !Sub '{{resolve:ssm:/${ProjectName}/${Environment}/s3/logs-bucket-name}}'
        # Consume KMS resources from SSM
        KmsKeyId: !Sub '{{resolve:ssm:/${ProjectName}/${Environment}/kms/main-key-id}}'
      Tags:
        - Key: Project
          Value: BANCOW
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: SAM
        - Key: StackType
          Value: Application

  # API Gateway Stack: REST/HTTP APIs, authorizers
  ApiGatewayStack:
    Type: AWS::CloudFormation::Stack
    DependsOn: AppStack
    Properties:
      TemplateURL: ./apigw.yaml
      Parameters:
        Environment: !Ref Environment
        ProjectName: !Ref ProjectName
        # Reference Lambda functions from AppStack
        SoapIntegrationFunctionArn: !GetAtt AppStack.Outputs.SoapIntegrationFunctionArn
        # Consume IAM resources from SSM
        LambdaExecutionRoleArn: !Sub '{{resolve:ssm:/${ProjectName}/${Environment}/iam/lambda-execution-role-arn}}'
      Tags:
        - Key: Project
          Value: BANCOW
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: SAM
        - Key: StackType
          Value: ApiGateway

  # Data Stack: Application-level data resources (not base S3 buckets)
  # This is for app-specific secrets and configuration
  DataStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ./data.yaml
      Parameters:
        Environment: !Ref Environment
        ProjectName: !Ref ProjectName
        # Consume KMS resources from SSM
        KmsKeyId: !Sub '{{resolve:ssm:/${ProjectName}/${Environment}/kms/main-key-id}}'
      Tags:
        - Key: Project
          Value: BANCOW
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: SAM
        - Key: StackType
          Value: Data

Outputs:
  AppStackId:
    Description: Application Stack ID
    Value: !Ref AppStack
    Export:
      Name: !Sub '${ProjectName}-${Environment}-app-stack-id'

  ApiGatewayStackId:
    Description: API Gateway Stack ID
    Value: !Ref ApiGatewayStack
    Export:
      Name: !Sub '${ProjectName}-${Environment}-apigw-stack-id'

  DataStackId:
    Description: Data Stack ID
    Value: !Ref DataStack
    Export:
      Name: !Sub '${ProjectName}-${Environment}-data-stack-id'

  ApiUrl:
    Description: API Gateway URL
    Value: !GetAtt ApiGatewayStack.Outputs.ApiUrl
    Export:
      Name: !Sub '${ProjectName}-${Environment}-api-url'
