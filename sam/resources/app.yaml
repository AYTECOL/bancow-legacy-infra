AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: 'BANCOW - Application Stack: Lambda, EventBridge'

Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, uat, prod]
    Description: Environment name
  ProjectName:
    Type: String
    Default: bancow
    Description: Project name for resource naming
  VpcId:
    Type: String
    Description: VPC ID from CDK base stack
  PrivateSubnetIds:
    Type: String
    Description: Comma-separated private subnet IDs from CDK base stack
  LambdaSecurityGroupId:
    Type: String
    Description: Lambda security group ID from CDK base stack
  LambdaExecutionRoleArn:
    Type: String
    Description: Lambda execution role ARN from CDK base stack
  ArtifactsBucketName:
    Type: String
    Description: Artifacts bucket name from CDK base stack
  LogsBucketName:
    Type: String
    Description: Logs bucket name from CDK base stack

Globals:
  Function:
    Runtime: nodejs18.x
    Timeout: 30
    MemorySize: 512
    Tracing: Active
    Environment:
      Variables:
        ENVIRONMENT: !Ref Environment
        PROJECT_NAME: !Ref ProjectName
        LOG_LEVEL: !If [IsProd, 'INFO', 'DEBUG']
        POWERTOOLS_SERVICE_NAME: bancow
        POWERTOOLS_METRICS_NAMESPACE: !Sub '${ProjectName}/${Environment}'
    Tags:
      Project: BANCOW
      Environment: !Ref Environment
      ManagedBy: SAM

Conditions:
  IsProd: !Equals [!Ref Environment, 'prod']
  IsNotProd: !Not [!Equals [!Ref Environment, 'prod']]

Resources:
  # Lambda function for SOAP integration
  # NOTE: Lambda code should be in separate repository (bancow-app)
  # This is just the infrastructure definition
  SoapIntegrationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-${Environment}-soap-integration'
      Description: Lambda function to integrate with external SOAP services
      CodeUri: ../../placeholder/  # Code deployed from bancow-app repo
      Handler: index.handler
      Role: !Ref LambdaExecutionRoleArn
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroupId
        SubnetIds: !Split [',', !Ref PrivateSubnetIds]
      Environment:
        Variables:
          SOAP_ENDPOINT_SSM_PATH: !Sub '/${ProjectName}/${Environment}/soap/endpoint'
          SECRETS_PREFIX: !Sub '${ProjectName}-${Environment}-soap'

  # Lambda function for API request handling
  ApiHandlerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-${Environment}-api-handler'
      Description: Lambda function to handle API Gateway requests
      CodeUri: ../../placeholder/  # Code deployed from bancow-app repo
      Handler: index.handler
      Role: !Ref LambdaExecutionRoleArn

  # CloudWatch Log Group for Lambda functions
  SoapIntegrationLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ProjectName}-${Environment}-soap-integration'
      RetentionInDays: !If [IsProd, 90, 30]

  ApiHandlerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ProjectName}-${Environment}-api-handler'
      RetentionInDays: !If [IsProd, 90, 30]

Outputs:
  SoapIntegrationFunctionArn:
    Description: SOAP Integration Lambda Function ARN
    Value: !GetAtt SoapIntegrationFunction.Arn
    Export:
      Name: !Sub '${ProjectName}-${Environment}-soap-function-arn'

  ApiHandlerFunctionArn:
    Description: API Handler Lambda Function ARN
    Value: !GetAtt ApiHandlerFunction.Arn
    Export:
      Name: !Sub '${ProjectName}-${Environment}-api-handler-arn'
