version = 0.1

[default]
[default.global.parameters]
stack_name = "bancow-app"
region = "us-east-1"

[default.build.parameters]
cached = true
parallel = true

[default.validate.parameters]
lint = true

[default.deploy.parameters]
capabilities = "CAPABILITY_IAM CAPABILITY_AUTO_EXPAND CAPABILITY_NAMED_IAM"
confirm_changeset = true
resolve_s3 = true
fail_on_empty_changeset = false

# Development Environment
[dev]
[dev.global.parameters]
stack_name = "bancow-dev-app"
region = "us-east-1"

[dev.deploy.parameters]
capabilities = "CAPABILITY_IAM CAPABILITY_AUTO_EXPAND CAPABILITY_NAMED_IAM"
confirm_changeset = false
resolve_s3 = true
s3_prefix = "bancow-dev"
parameter_overrides = [
    "Environment=dev",
    "ProjectName=bancow"
]
tags = [
    "Project=BANCOW",
    "Environment=dev",
    "ManagedBy=SAM",
    "Owner=Platform Team"
]

# UAT Environment
[uat]
[uat.global.parameters]
stack_name = "bancow-uat-app"
region = "us-east-1"

[uat.deploy.parameters]
capabilities = "CAPABILITY_IAM CAPABILITY_AUTO_EXPAND CAPABILITY_NAMED_IAM"
confirm_changeset = true
resolve_s3 = true
s3_prefix = "bancow-uat"
parameter_overrides = [
    "Environment=uat",
    "ProjectName=bancow"
]
tags = [
    "Project=BANCOW",
    "Environment=uat",
    "ManagedBy=SAM",
    "Owner=Platform Team"
]

# Production Environment
[prod]
[prod.global.parameters]
stack_name = "bancow-prod-app"
region = "us-east-1"

[prod.deploy.parameters]
capabilities = "CAPABILITY_IAM CAPABILITY_AUTO_EXPAND CAPABILITY_NAMED_IAM"
confirm_changeset = true
resolve_s3 = true
s3_prefix = "bancow-prod"
parameter_overrides = [
    "Environment=prod",
    "ProjectName=bancow"
]
tags = [
    "Project=BANCOW",
    "Environment=prod",
    "ManagedBy=SAM",
    "Owner=Platform Team",
    "Compliance=PCI-DSS"
]
