AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  BANCOW - Async Stack
  Step Functions orchestration + atomic Lambdas
  No API Gateway, no proxy, no starter

Parameters:
  Environment:
    Type: String
    AllowedValues: [ dev, uat, prod ]

  PrivateSubnetIds:
    Type: CommaDelimitedList

  LambdaSecurityGroupId:
    Type: String

  LambdaExecutionRoleArn:
    Type: String

  SoapCredentialsArn:
    Type: String

  ArtifactBucket:
    Type: String

  ArtifactKey:
    Type: String
    Default: ''
    Description: Optional explicit S3 key for Lambda deployment package. If empty, the default stable key (lambda/bancow-service.zip) is used.

  LogLevel:
    Type: String
    Default: INFO
    AllowedValues: [ DEBUG, INFO, WARN, ERROR ]

  ArtifactHash:
    Type: String
    Description: Forces Lambda update when artifact changes

Mappings:
  SoapConfig:
    dev:
      ALLOWINSECURETLS: 'true'
      SOAPENDPOINT: 'https://10.40.7.18:8017/bancow/servlet/com.dlya.bantotal.odwsbt_BTPersonas_v1'
    uat:
      ALLOWINSECURETLS: 'true'
      SOAPENDPOINT: 'https://10.40.7.18:8017/bancow/servlet/com.dlya.bantotal.odwsbt_BTPersonas_v1'
    prod:
      ALLOWINSECURETLS: 'false'
      SOAPENDPOINT: 'https://10.40.7.18:8017/bancow/servlet/com.dlya.bantotal.odwsbt_BTPersonas_v1'

Conditions:
  UseExplicitArtifactKey: !Not [ !Equals [ !Ref ArtifactKey, '' ] ]

Resources:
  SfnLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/vendedlogs/states/bancow-${Environment}-v3-person-natural'
      RetentionInDays: 14

  GetPersonFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'bancow-${Environment}-person'
      Runtime: nodejs22.x
      Handler: index.getPhysicalPersonSfn
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !If
          - UseExplicitArtifactKey
          - !Ref ArtifactKey
          - 'lambda/bancow-service.zip'
      Role: !Ref LambdaExecutionRoleArn
      Timeout: 20
      MemorySize: 1024
      VpcConfig:
        SubnetIds: !Ref PrivateSubnetIds
        SecurityGroupIds:
          - !Ref LambdaSecurityGroupId
      LoggingConfig:
        LogGroup: !Sub '/aws/lambda/bancow-${Environment}-person'
      Environment:
        Variables:
          ARTIFACT_HASH: !Ref ArtifactHash
          ENVIRONMENT: !Ref Environment
          LOG_LEVEL: !Ref LogLevel
          SOAP_ENDPOINT: !FindInMap [ SoapConfig, !Ref Environment, SOAPENDPOINT ]
          ALLOW_INSECURE_TLS: !FindInMap [ SoapConfig, !Ref Environment, ALLOWINSECURETLS ]
          SECRETS_ARN: !Ref SoapCredentialsArn

  GetAddressesFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'bancow-${Environment}-addresses'
      Runtime: nodejs22.x
      Handler: index.getAddressesPersonSfn
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !If
          - UseExplicitArtifactKey
          - !Ref ArtifactKey
          - 'lambda/bancow-service.zip'
      Role: !Ref LambdaExecutionRoleArn
      Timeout: 20
      MemorySize: 1024
      VpcConfig:
        SubnetIds: !Ref PrivateSubnetIds
        SecurityGroupIds:
          - !Ref LambdaSecurityGroupId
      LoggingConfig:
        LogGroup: !Sub '/aws/lambda/bancow-${Environment}-addresses'
      Environment:
        Variables:
          ARTIFACT_HASH: !Ref ArtifactHash
          ENVIRONMENT: !Ref Environment
          LOG_LEVEL: !Ref LogLevel
          SOAP_ENDPOINT: !FindInMap [ SoapConfig, !Ref Environment, SOAPENDPOINT ]
          ALLOW_INSECURE_TLS: !FindInMap [ SoapConfig, !Ref Environment, ALLOWINSECURETLS ]
          SECRETS_ARN: !Ref SoapCredentialsArn

  # Forces Lambda code refresh on every new ArtifactHash even if S3 key stays stable.
  AsyncFunctionsCodeUpdaterRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: Logs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'
        - PolicyName: UpdateFunctionCode
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:UpdateFunctionCode
                Resource:
                  - !GetAtt GetPersonFunction.Arn
                  - !GetAtt GetAddressesFunction.Arn
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${ArtifactBucket}/*'

  AsyncFunctionsCodeUpdater:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'bancow-${Environment}-async-code-updater'
      Runtime: python3.11
      Handler: index.handler
      Role: !GetAtt AsyncFunctionsCodeUpdaterRole.Arn
      Timeout: 60
      Code:
        ZipFile: |
          import json
          import boto3
          import urllib.request

          lambda_client = boto3.client('lambda')

          def _send(event, context, status, data=None, reason=None):
              response_url = event['ResponseURL']
              body = {
                  'Status': status,
                  'Reason': reason or f"See details in CloudWatch Log Stream: {context.log_stream_name}",
                  'PhysicalResourceId': event.get('PhysicalResourceId') or context.log_stream_name,
                  'StackId': event['StackId'],
                  'RequestId': event['RequestId'],
                  'LogicalResourceId': event['LogicalResourceId'],
                  'Data': data or {}
              }
              json_body = json.dumps(body).encode('utf-8')
              req = urllib.request.Request(
                  response_url,
                  data=json_body,
                  method='PUT',
                  headers={
                      'content-type': '',
                      'content-length': str(len(json_body))
                  }
              )
              with urllib.request.urlopen(req) as f:
                  f.read()

          def handler(event, context):
              try:
                  req_type = event.get('RequestType')
                  props = event.get('ResourceProperties') or {}

                  if req_type == 'Delete':
                      _send(event, context, 'SUCCESS', {'deleted': True})
                      return

                  targets = props.get('TargetFunctionNames') or []
                  bucket = props.get('S3Bucket')
                  key = props.get('S3Key')

                  if not targets or not bucket or not key:
                      _send(event, context, 'FAILED', reason='Missing TargetFunctionNames/S3Bucket/S3Key')
                      return

                  updated = []
                  for fn_name in targets:
                      resp = lambda_client.update_function_code(
                          FunctionName=fn_name,
                          S3Bucket=bucket,
                          S3Key=key,
                          Publish=False
                      )
                      updated.append({
                          'function': fn_name,
                          'codeSha256': resp.get('CodeSha256', '')
                      })

                  _send(event, context, 'SUCCESS', {
                      'updated': updated,
                      's3': f"s3://{bucket}/{key}"
                  })
              except Exception as e:
                  _send(event, context, 'FAILED', reason=str(e))

  AsyncFunctionsCodeUpdate:
    Type: Custom::LambdaCodeUpdate
    DependsOn:
      - GetPersonFunction
      - GetAddressesFunction
    Properties:
      ServiceToken: !GetAtt AsyncFunctionsCodeUpdater.Arn
      ArtifactHash: !Ref ArtifactHash
      TargetFunctionNames:
        - !Ref GetPersonFunction
        - !Ref GetAddressesFunction
      S3Bucket: !Ref ArtifactBucket
      S3Key: !If
        - UseExplicitArtifactKey
        - !Ref ArtifactKey
        - 'lambda/bancow-service.zip'

  PersonNaturalStateMachineRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'bancow-${Environment}-person-natural-sfn-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: StepFunctionsLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogDelivery
                  - logs:GetLogDelivery
                  - logs:UpdateLogDelivery
                  - logs:DeleteLogDelivery
                  - logs:ListLogDeliveries
                  - logs:PutResourcePolicy
                  - logs:DescribeResourcePolicies
                  - logs:DescribeLogGroups
                Resource: "*"

              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub '${SfnLogGroup.Arn}:*'
        - PolicyName: InvokeLambdas
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                  - !GetAtt GetPersonFunction.Arn
                  - !GetAtt GetAddressesFunction.Arn

        - PolicyName: XRayTracing
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                Resource: "*"

  PersonNaturalStateMachine:
    Type: AWS::Serverless::StateMachine
    DependsOn: SfnLogGroup
    Properties:
      Name: !Sub 'bancow-${Environment}-person-natural'
      Type: EXPRESS
      Role: !GetAtt PersonNaturalStateMachineRole.Arn
      DefinitionUri: ../state-machines/person-natural.asl.json
      DefinitionSubstitutions:
        GetPersonFn: !GetAtt GetPersonFunction.Arn
        GetAddressesFn: !GetAtt GetAddressesFunction.Arn
      Logging:
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt SfnLogGroup.Arn
        Level: ALL
        IncludeExecutionData: true
      Tracing:
        Enabled: true

  GetPersonInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref GetPersonFunction
      Action: lambda:InvokeFunction
      Principal: states.amazonaws.com
      SourceArn: !Ref PersonNaturalStateMachine

  GetAddressesInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref GetAddressesFunction
      Action: lambda:InvokeFunction
      Principal: states.amazonaws.com
      SourceArn: !Ref PersonNaturalStateMachine

Outputs:
  StateMachineArn:
    Value: !Ref PersonNaturalStateMachine
