AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  BANCOW - Async Stack
  Step Functions orchestration + atomic Lambdas
  No API Gateway, no proxy, no starter

Parameters:
  Environment:
    Type: String
    AllowedValues: [ dev, uat, prod ]

  PrivateSubnetIds:
    Type: CommaDelimitedList

  LambdaSecurityGroupId:
    Type: String

  LambdaExecutionRoleArn:
    Type: String

  SoapCredentialsArn:
    Type: String

  ArtifactBucket:
    Type: String

  ArtifactKey:
    Type: String
    Default: ''
    Description: Optional explicit S3 key for Lambda deployment package. If empty, the default stable key (lambda/bancow-service.zip) is used.

  LogLevel:
    Type: String
    Default: INFO
    AllowedValues: [ DEBUG, INFO, WARN, ERROR ]

  ArtifactHash:
    Type: String
    Description: Forces Lambda update when artifact changes

Mappings:
  SoapConfig:
    dev:
      ALLOWINSECURETLS: 'true'
      SOAPENDPOINT: 'https://10.40.7.18:8017/bancow/servlet/com.dlya.bantotal.odwsbt_BTPersonas_v1'
    uat:
      ALLOWINSECURETLS: 'true'
      SOAPENDPOINT: 'https://10.40.7.18:8017/bancow/servlet/com.dlya.bantotal.odwsbt_BTPersonas_v1'
    prod:
      ALLOWINSECURETLS: 'false'
      SOAPENDPOINT: 'https://10.40.7.18:8017/bancow/servlet/com.dlya.bantotal.odwsbt_BTPersonas_v1'

Conditions:
  UseExplicitArtifactKey: !Not [ !Equals [ !Ref ArtifactKey, '' ] ]

Resources:
  # DynamoDB Table for Rick and Morty Async Results
  AsyncResultsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'bancow-${Environment}-async-results'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: requestId
          AttributeType: S
      KeySchema:
        - AttributeName: requestId
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Purpose
          Value: RickMortyAsyncExercise

  SfnLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/vendedlogs/states/bancow-${Environment}-v3-person-natural'
      RetentionInDays: 14

  RickMortySfnLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/vendedlogs/states/bancow-${Environment}-rick-morty-async'
      RetentionInDays: 14

  GetPersonFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'bancow-${Environment}-person'
      Runtime: nodejs22.x
      Handler: index.getPhysicalPersonSfn
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !If
          - UseExplicitArtifactKey
          - !Ref ArtifactKey
          - 'lambda/bancow-service.zip'
      Role: !Ref LambdaExecutionRoleArn
      Timeout: 20
      MemorySize: 1024
      VpcConfig:
        SubnetIds: !Ref PrivateSubnetIds
        SecurityGroupIds:
          - !Ref LambdaSecurityGroupId
      LoggingConfig:
        LogGroup: !Sub '/aws/lambda/bancow-${Environment}-person'
      Environment:
        Variables:
          ARTIFACT_HASH: !Ref ArtifactHash
          ENVIRONMENT: !Ref Environment
          LOG_LEVEL: !Ref LogLevel
          SOAP_ENDPOINT: !FindInMap [ SoapConfig, !Ref Environment, SOAPENDPOINT ]
          ALLOW_INSECURE_TLS: !FindInMap [ SoapConfig, !Ref Environment, ALLOWINSECURETLS ]
          SECRETS_ARN: !Ref SoapCredentialsArn

  GetAddressesFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'bancow-${Environment}-addresses'
      Runtime: nodejs22.x
      Handler: index.getAddressesPersonSfn
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !If
          - UseExplicitArtifactKey
          - !Ref ArtifactKey
          - 'lambda/bancow-service.zip'
      Role: !Ref LambdaExecutionRoleArn
      Timeout: 20
      MemorySize: 1024
      VpcConfig:
        SubnetIds: !Ref PrivateSubnetIds
        SecurityGroupIds:
          - !Ref LambdaSecurityGroupId
      LoggingConfig:
        LogGroup: !Sub '/aws/lambda/bancow-${Environment}-addresses'
      Environment:
        Variables:
          ARTIFACT_HASH: !Ref ArtifactHash
          ENVIRONMENT: !Ref Environment
          LOG_LEVEL: !Ref LogLevel
          SOAP_ENDPOINT: !FindInMap [ SoapConfig, !Ref Environment, SOAPENDPOINT ]
          ALLOW_INSECURE_TLS: !FindInMap [ SoapConfig, !Ref Environment, ALLOWINSECURETLS ]
          SECRETS_ARN: !Ref SoapCredentialsArn

  PersonNaturalStateMachineRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'bancow-${Environment}-person-natural-sfn-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: StepFunctionsLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogDelivery
                  - logs:GetLogDelivery
                  - logs:UpdateLogDelivery
                  - logs:DeleteLogDelivery
                  - logs:ListLogDeliveries
                  - logs:PutResourcePolicy
                  - logs:DescribeResourcePolicies
                  - logs:DescribeLogGroups
                Resource: "*"

              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub '${SfnLogGroup.Arn}:*'
        - PolicyName: InvokeLambdas
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                  - !GetAtt GetPersonFunction.Arn
                  - !GetAtt GetAddressesFunction.Arn

        - PolicyName: XRayTracing
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                Resource: "*"
        - PolicyName: HttpInvokePermissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - events:RetrieveConnectionCredentials
                  - events:DescribeConnection
                Resource:
                  - arn:aws:events:us-east-1:334333507387:connection/bancow-apigw-connection/*

              - Effect: Allow
                Action:
                  - events:InvokeApiDestination
                Resource: "*"
        - PolicyName: InvokeHttpEndpoints
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - states:InvokeHTTPEndpoint
                Resource: "*"

        - PolicyName: EventBridgeConnectionSecrets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:DescribeSecret
                  - secretsmanager:GetSecretValue
                Resource:
                  - arn:aws:secretsmanager:us-east-1:334333507387:secret:events!connection/bancow-apigw-connection/*

  PersonNaturalStateMachine:
    Type: AWS::Serverless::StateMachine
    DependsOn: SfnLogGroup
    Properties:
      Name: !Sub 'bancow-${Environment}-person-natural'
      Type: EXPRESS
      Role: !GetAtt PersonNaturalStateMachineRole.Arn
      DefinitionUri: ../state-machines/person-natural.asl.json
      DefinitionSubstitutions:
        GetPersonFn: !GetAtt GetPersonFunction.Arn
        GetAddressesFn: !GetAtt GetAddressesFunction.Arn
      Logging:
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt SfnLogGroup.Arn
        Level: ALL
        IncludeExecutionData: true
      Tracing:
        Enabled: true

  GetPersonInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref GetPersonFunction
      Action: lambda:InvokeFunction
      Principal: states.amazonaws.com
      SourceArn: !Ref PersonNaturalStateMachine

  GetAddressesInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref GetAddressesFunction
      Action: lambda:InvokeFunction
      Principal: states.amazonaws.com
      SourceArn: !Ref PersonNaturalStateMachine

  # Rick and Morty Async State Machine Role
  RickMortyStateMachineRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'bancow-${Environment}-rick-morty-async-sfn-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: StepFunctionsLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogDelivery
                  - logs:GetLogDelivery
                  - logs:UpdateLogDelivery
                  - logs:DeleteLogDelivery
                  - logs:ListLogDeliveries
                  - logs:PutResourcePolicy
                  - logs:DescribeResourcePolicies
                  - logs:DescribeLogGroups
                Resource: "*"

              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub '${RickMortySfnLogGroup.Arn}:*'

        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                Resource:
                  - !GetAtt AsyncResultsTable.Arn

        - PolicyName: HttpInvokePermissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - states:InvokeHTTPEndpoint
                Resource: "*"
                Condition:
                  StringEquals:
                    states:HTTPMethod: GET
                  StringLike:
                    states:HTTPEndpoint: "https://rickandmortyapi.com/*"

        - PolicyName: XRayTracing
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                Resource: "*"

  # Rick and Morty Async State Machine
  RickMortyStateMachine:
    Type: AWS::Serverless::StateMachine
    DependsOn: RickMortySfnLogGroup
    Properties:
      Name: !Sub 'bancow-${Environment}-rick-morty-async'
      Type: EXPRESS
      Role: !GetAtt RickMortyStateMachineRole.Arn
      DefinitionUri: ../state-machines/rick-morty-async.asl.json
      DefinitionSubstitutions:
        AsyncResultsTable: !Ref AsyncResultsTable
      Logging:
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt RickMortySfnLogGroup.Arn
        Level: ALL
        IncludeExecutionData: true
      Tracing:
        Enabled: true

  # Weather Orchestrator Log Group
  WeatherOrchestratorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/vendedlogs/states/bancow-${Environment}-weather-orchestrator'
      RetentionInDays: 14

  # Weather Orchestrator Role
  WeatherOrchestratorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'bancow-${Environment}-weather-orchestrator-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: StepFunctionsLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogDelivery
                  - logs:GetLogDelivery
                  - logs:UpdateLogDelivery
                  - logs:DeleteLogDelivery
                  - logs:ListLogDeliveries
                  - logs:PutResourcePolicy
                  - logs:DescribeResourcePolicies
                  - logs:DescribeLogGroups
                Resource: "*"
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub '${WeatherOrchestratorLogGroup.Arn}:*'

        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                Resource:
                  - !GetAtt AsyncResultsTable.Arn

        - PolicyName: HttpInvokePermissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - states:InvokeHTTPEndpoint
                Resource: "*"
                Condition:
                  StringEquals:
                    states:HTTPMethod: GET
                  StringLike:
                    states:HTTPEndpoint: "https://api.open-meteo.com/*"
              - Effect: Allow
                Action:
                  - events:RetrieveConnectionCredentials
                  - events:DescribeConnection
                Resource: "*"
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                  - secretsmanager:DescribeSecret
                Resource:
                  - !Sub 'arn:aws:secretsmanager:us-east-1:334333507387:secret:events!connection/RickMortyPublic/*'

        - PolicyName: XRayTracing
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                Resource: "*"

  # Weather Orchestrator State Machine
  WeatherOrchestratorSfn:
    Type: AWS::Serverless::StateMachine
    DependsOn: WeatherOrchestratorLogGroup
    Properties:
      Name: !Sub 'bancow-${Environment}-weather-orchestrator'
      Type: STANDARD
      Role: !GetAtt WeatherOrchestratorRole.Arn
      DefinitionUri: ../state-machines/weather-orchestrator.asl.json
      DefinitionSubstitutions:
        AsyncResultsTable: !Ref AsyncResultsTable
      Logging:
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt WeatherOrchestratorLogGroup.Arn
        Level: ALL
        IncludeExecutionData: true
      Tracing:
        Enabled: true

Outputs:
  WeatherOrchestratorArn:
    Description: ARN of the Weather Orchestrator State Machine
    Value: !Ref WeatherOrchestratorSfn
    Export:
      Name: !Sub 'bancow-${Environment}-weather-orchestrator-arn'
  StateMachineArn:
    Value: !Ref PersonNaturalStateMachine

  RickMortyStateMachineArn:
    Description: ARN of the Rick and Morty Async State Machine
    Value: !Ref RickMortyStateMachine
    Export:
      Name: !Sub 'bancow-${Environment}-rick-morty-sfn-arn'

  AsyncResultsTableName:
    Description: Name of the DynamoDB table for async results
    Value: !Ref AsyncResultsTable
    Export:
      Name: !Sub 'bancow-${Environment}-async-results-table'

  AsyncResultsTableArn:
    Description: ARN of the DynamoDB table for async results
    Value: !GetAtt AsyncResultsTable.Arn
    Export:
      Name: !Sub 'bancow-${Environment}-async-results-table-arn'
