AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >-
  BANCOW Infrastructure - App Stack
  Lambda functions and API Gateway (Deployment Unit Pattern)
  This stack deploys application code but does NOT create VPC, IAM roles, or databases.

Parameters:
  Environment:
    Type: String
    Description: Environment name
    AllowedValues: [ dev, uat, prod ]

  # Network parameters (passed from root)
  VpcId:
    Type: String
    Description: VPC ID for Lambda

  PrivateSubnetIds:
    Type: CommaDelimitedList
    Description: Private subnet IDs for Lambda (comma-separated)

  LambdaSecurityGroupId:
    Type: String
    Description: Security Group ID for Lambda

  # Security parameters (passed from root)
  LambdaExecutionRoleArn:
    Type: String
    Description: ARN of Lambda execution role

  UserPoolArn:
    Type: String
    Description: ARN of Cognito User Pool

  WebACLArn:
    Type: String
    Description: ARN of WAF Web ACL

  # Data parameters (passed from root)
  SoapCredentialsArn:
    Type: String
    Description: ARN of Secrets Manager secret for SOAP credentials

  # Artifact parameters (passed from root)
  LambdaArtifactBucket:
    Type: String
    Description: S3 bucket containing Lambda deployment artifacts

  LambdaArtifactKey:
    Type: String
    Default: ''
    Description: Optional explicit S3 key for Lambda deployment package. If empty, a hash-based key is used.

  ArtifactHash:
    Type: String
    Description: Forces Lambda update when artifact changes

  # V2 Step Functions integration
  PersonNaturalStateMachineArn:
    Type: String
    Description: ARN of the v2 Step Function from Async stack

  # Application configuration
  LogLevel:
    Type: String
    Default: INFO
    AllowedValues: [ DEBUG, INFO, WARN, ERROR ]
    Description: Application log level

Mappings:
  SoapConfig:
    dev:
      ALLOWINSECURETLS: 'true'
      SOAPENDPOINT: 'https://10.40.7.18:8017/bancow/servlet/com.dlya.bantotal.odwsbt_BTPersonas_v1'
    uat:
      ALLOWINSECURETLS: 'true'
      SOAPENDPOINT: 'https://10.40.7.18:8017/bancow/servlet/com.dlya.bantotal.odwsbt_BTPersonas_v1'
    prod:
      ALLOWINSECURETLS: 'false'
      SOAPENDPOINT: 'https://10.40.7.18:8017/bancow/servlet/com.dlya.bantotal.odwsbt_BTPersonas_v1'

Conditions:
  UseExplicitLambdaArtifactKey: !Not [ !Equals [ !Ref LambdaArtifactKey, '' ] ]

Resources:
  # IAM Role for API Gateway to execute Step Functions
  ApiStepFunctionsRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ExecuteStepFunctions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - states:StartSyncExecution
                Resource: !Ref PersonNaturalStateMachineArn

  # API Gateway REST API
  ApiGateway:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub 'bancow-${Environment}-api'
      StageName: !Ref Environment
      EndpointConfiguration: REGIONAL
      DefinitionBody:
        openapi: '3.0.1'
        info:
          title: !Sub 'bancow-${Environment}-api'
          version: '1.0'
        paths:
          /person/physical:
            post:
              security:
                - CognitoAuthorizer:
                    - api/read
              x-amazon-apigateway-integration:
                timeoutInMillis: 29000
                httpMethod: POST
                type: aws_proxy
                uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ServiceFunction.Arn}/invocations'
              responses: {}
          /person/addresses:
            post:
              security:
                - CognitoAuthorizer:
                    - api/read
              x-amazon-apigateway-integration:
                timeoutInMillis: 29000
                httpMethod: POST
                type: aws_proxy
                uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ServiceFunction.Arn}/invocations'
              responses: {}
          /person/natural:
            post:
              security:
                - CognitoAuthorizer:
                    - api/read
              x-amazon-apigateway-integration:
                timeoutInMillis: 29000
                type: aws
                uri: !Sub 'arn:aws:apigateway:${AWS::Region}:states:action/StartSyncExecution'
                httpMethod: POST
                credentials: !GetAtt ApiStepFunctionsRole.Arn
                requestTemplates:
                  application/json: !Sub |
                    {
                      "stateMachineArn": "${PersonNaturalStateMachineArn}",
                      "input": "$util.escapeJavaScript($input.json('$'))"
                    }
                responses:
                  default:
                    statusCode: '200'
                    responseTemplates:
                      application/json: |
                        #set($body = $util.parseJson($input.body))
                        #if($body.output && $body.output != "")
                          $util.toJson($util.parseJson($body.output))
                        #else
                          $util.toJson({"message":"StartSyncExecution no devolvió output","raw":$body})
                        #end
              responses:
                '200':
                  description: OK
        components:
          securitySchemes:
            CognitoAuthorizer:
              type: apiKey
              name: Authorization
              in: header
              x-amazon-apigateway-authtype: cognito_user_pools
              x-amazon-apigateway-authorizer:
                providerARNs:
                  - !Ref UserPoolArn
                type: cognito_user_pools
        x-amazon-apigateway-cors:
          allowOrigins:
            - '*'
          allowMethods:
            - GET
            - POST
            - OPTIONS
          allowHeaders:
            - Authorization
            - Content-Type
      TracingEnabled: true
      Tags:
        Name: !Sub 'bancow-${Environment}-api'
        Environment: !Ref Environment

  # Lambda Function - Service Function (v1)
  # NOTE: Initially deployed with InlineCode placeholder to allow infrastructure deployment
  # before the app artifact exists in S3. After the app workflow runs and uploads the artifact,
  # uncomment CodeUri and comment out InlineCode, then redeploy.
  ServiceFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'bancow-${Environment}-service-fn'
      Runtime: nodejs22.x
      Handler: index.main
      CodeUri:
        Bucket: !Ref LambdaArtifactBucket
        Key: !If
          - UseExplicitLambdaArtifactKey
          - !Ref LambdaArtifactKey
          - 'lambda/bancow-service.zip'
      Role: !Ref LambdaExecutionRoleArn
      Timeout: 30
      MemorySize: 512
      VpcConfig:
        SubnetIds: !Ref PrivateSubnetIds
        SecurityGroupIds:
          - !Ref LambdaSecurityGroupId
      Environment:
        Variables:
          ARTIFACT_HASH: !Ref ArtifactHash
          ENVIRONMENT: !Ref Environment
          LOG_LEVEL: !Ref LogLevel
          SOAP_ENDPOINT: !FindInMap [ SoapConfig, !Ref Environment, SOAPENDPOINT ]
          ALLOW_INSECURE_TLS: !FindInMap [ SoapConfig, !Ref Environment, ALLOWINSECURETLS ]
          SOAP_CREDENTIALS_SECRET_ARN: !Ref SoapCredentialsArn

  # Forces Lambda code refresh on every new ArtifactHash even if S3 key stays stable.
  # This avoids S3 bucket versioning and avoids creating multiple ZIP objects per publish.
  ServiceFunctionCodeUpdaterRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: Logs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'
        - PolicyName: UpdateFunctionCode
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:UpdateFunctionCode
                Resource:
                  - !GetAtt ServiceFunction.Arn
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${LambdaArtifactBucket}/*'

  ServiceFunctionCodeUpdater:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'bancow-${Environment}-service-code-updater'
      Runtime: python3.11
      Handler: index.handler
      Role: !GetAtt ServiceFunctionCodeUpdaterRole.Arn
      Timeout: 60
      Code:
        ZipFile: |
          import json
          import boto3
          import urllib.request
          import urllib.error

          lambda_client = boto3.client('lambda')

          def _send(event, context, status, data=None, reason=None):
              response_url = event['ResponseURL']
              body = {
                  'Status': status,
                  'Reason': reason or f"See details in CloudWatch Log Stream: {context.log_stream_name}",
                  'PhysicalResourceId': event.get('PhysicalResourceId') or context.log_stream_name,
                  'StackId': event['StackId'],
                  'RequestId': event['RequestId'],
                  'LogicalResourceId': event['LogicalResourceId'],
                  'Data': data or {}
              }
              json_body = json.dumps(body).encode('utf-8')
              req = urllib.request.Request(
                  response_url,
                  data=json_body,
                  method='PUT',
                  headers={
                      'content-type': '',
                      'content-length': str(len(json_body))
                  }
              )
              with urllib.request.urlopen(req) as f:
                  f.read()

          def handler(event, context):
              try:
                  req_type = event.get('RequestType')
                  props = event.get('ResourceProperties') or {}

                  if req_type == 'Delete':
                      _send(event, context, 'SUCCESS', {'deleted': True})
                      return

                  function_name = props.get('TargetFunctionName')
                  bucket = props.get('S3Bucket')
                  key = props.get('S3Key')

                  if not function_name or not bucket or not key:
                      _send(event, context, 'FAILED', reason='Missing TargetFunctionName/S3Bucket/S3Key')
                      return

                  resp = lambda_client.update_function_code(
                      FunctionName=function_name,
                      S3Bucket=bucket,
                      S3Key=key,
                      Publish=False
                  )

                  _send(event, context, 'SUCCESS', {
                      'updated': True,
                      'function': function_name,
                      's3': f"s3://{bucket}/{key}",
                      'codeSha256': resp.get('CodeSha256', '')
                  })
              except Exception as e:
                  _send(event, context, 'FAILED', reason=str(e))

  ServiceFunctionCodeUpdate:
    Type: Custom::LambdaCodeUpdate
    DependsOn:
      - ServiceFunction
    Properties:
      ServiceToken: !GetAtt ServiceFunctionCodeUpdater.Arn
      ArtifactHash: !Ref ArtifactHash
      TargetFunctionName: !Ref ServiceFunction
      S3Bucket: !Ref LambdaArtifactBucket
      S3Key: !If
        - UseExplicitLambdaArtifactKey
        - !Ref LambdaArtifactKey
        - 'lambda/bancow-service.zip'

  # Lambda Permissions to allow API Gateway to invoke the function
  ServiceFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt ServiceFunction.Arn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiGateway}/*/*/person/*'

  # WAF Web ACL Association
  WebACLAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    DependsOn:
      - ApiGateway
      - ServiceFunction
      - ApiGatewayStage
    Properties:
      ResourceArn: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}::/restapis/${ApiGateway}/stages/${Environment}'
      WebACLArn: !Ref WebACLArn


Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub 'https://${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com/${Environment}'
    Export:
      Name: !Sub 'bancow-${Environment}-api-url'

  ApiId:
    Description: API Gateway ID
    Value: !Ref ApiGateway
    Export:
      Name: !Sub 'bancow-${Environment}-api-id'

  UserPoolArn:
    Description: Cognito User Pool ARN
    Value: !Ref UserPoolArn
    Export:
      Name: !Sub 'bancow-${Environment}-user-pool-arn'

  ServiceFunctionArn:
    Description: Lambda function ARN
    Value: !GetAtt ServiceFunction.Arn
    Export:
      Name: !Sub 'bancow-${Environment}-service-fn-arn'

  ServiceFunctionName:
    Description: Lambda function name
    Value: !Ref ServiceFunction
    Export:
      Name: !Sub 'bancow-${Environment}-service-fn-name'

