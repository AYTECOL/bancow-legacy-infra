AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >-
  BANCOW Infrastructure - App Stack
  Lambda functions and API Gateway (Deployment Unit Pattern)
  This stack deploys application code but does NOT create VPC, IAM roles, or databases.

Parameters:
  Environment:
    Type: String
    Description: Environment name
    AllowedValues: [ dev, uat, prod ]

  # Network parameters (passed from root)
  VpcId:
    Type: String
    Description: VPC ID for Lambda

  PrivateSubnetIds:
    Type: CommaDelimitedList
    Description: Private subnet IDs for Lambda (comma-separated)

  LambdaSecurityGroupId:
    Type: String
    Description: Security Group ID for Lambda

  # Security parameters (passed from root)
  LambdaExecutionRoleArn:
    Type: String
    Description: ARN of Lambda execution role

  UserPoolArn:
    Type: String
    Description: ARN of Cognito User Pool

  WebACLArn:
    Type: String
    Description: ARN of WAF Web ACL

  # Data parameters (passed from root)
  SoapCredentialsArn:
    Type: String
    Description: ARN of Secrets Manager secret for SOAP credentials

  # Artifact parameters (passed from root)
  LambdaArtifactBucket:
    Type: String
    Description: S3 bucket containing Lambda deployment artifacts

  LambdaArtifactKey:
    Type: String
    Default: ''
    Description: Optional explicit S3 key for Lambda deployment package. If empty, the default stable key (lambda/bancow-service.zip) is used.

  ArtifactHash:
    Type: String
    Description: Forces Lambda update when artifact changes

  # V2 Step Functions integration
  PersonNaturalStateMachineArn:
    Type: String
    Description: ARN of the v2 Step Function from Async stack

  # Rick and Morty Async integration
  RickMortyStateMachineArn:
    Type: String
    Description: ARN of the Rick and Morty Async State Machine from Async stack

  WeatherOrchestratorArn:
    Type: String
    Description: ARN of the Weather Orchestrator State Machine from Async stack

  AsyncResultsTableName:
    Type: String
    Description: Name of the DynamoDB table for async results

  # Application configuration
  LogLevel:
    Type: String
    Default: INFO
    AllowedValues: [ DEBUG, INFO, WARN, ERROR ]
    Description: Application log level

Mappings:
  SoapConfig:
    dev:
      ALLOWINSECURETLS: 'true'
      SOAPENDPOINT: 'https://10.40.7.18:8017/bancow/servlet/com.dlya.bantotal.odwsbt_BTPersonas_v1'
    uat:
      ALLOWINSECURETLS: 'true'
      SOAPENDPOINT: 'https://10.40.7.18:8017/bancow/servlet/com.dlya.bantotal.odwsbt_BTPersonas_v1'
    prod:
      ALLOWINSECURETLS: 'false'
      SOAPENDPOINT: 'https://10.40.7.18:8017/bancow/servlet/com.dlya.bantotal.odwsbt_BTPersonas_v1'

Conditions:
  UseExplicitLambdaArtifactKey: !Not [ !Equals [ !Ref LambdaArtifactKey, '' ] ]

Resources:
  # IAM Role for API Gateway to execute Step Functions
  ApiStepFunctionsRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ExecuteStepFunctions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - states:StartSyncExecution
                Resource: !Ref PersonNaturalStateMachineArn

  # IAM Role for API Gateway to execute Rick and Morty Async workflows
  ApiRickMortyRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'bancow-${Environment}-api-rick-morty-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: StartAsyncExecution
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - states:StartExecution
                Resource: !Ref RickMortyStateMachineArn

        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                Resource: !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AsyncResultsTableName}'

  # IAM Role for API Gateway to execute Weather Orchestrator
  ApiWeatherRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'bancow-${Environment}-api-weather-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: StartAsyncExecution
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - states:StartExecution
                Resource: !Ref WeatherOrchestratorArn

        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:UpdateItem
                Resource: !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AsyncResultsTableName}'

  # API Gateway REST API
  ApiGateway:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub 'bancow-${Environment}-api'
      StageName: !Ref Environment
      EndpointConfiguration: REGIONAL
      AlwaysDeploy: true
      DefinitionBody:
        openapi: '3.0.1'
        info:
          title: !Sub 'bancow-${Environment}-api'
          version: '1.0'
        paths:
          /person/physical:
            post:
              security:
                - CognitoAuthorizer:
                    - api/read
              x-amazon-apigateway-integration:
                timeoutInMillis: 29000
                httpMethod: POST
                type: aws_proxy
                uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ServiceFunction.Arn}/invocations'
              responses: {}
          /person/addresses:
            post:
              security:
                - CognitoAuthorizer:
                    - api/read
              x-amazon-apigateway-integration:
                timeoutInMillis: 29000
                httpMethod: POST
                type: aws_proxy
                uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ServiceFunction.Arn}/invocations'
              responses: {}
          /person/natural:
            post:
              security:
                - CognitoAuthorizer:
                    - api/read
              responses:
                '200':
                  description: OK
                  content:
                    application/json:
                      schema:
                        type: object
                    application/x-amz-json-1.0:
                      schema:
                        type: object
                    text/plain:
                      schema:
                        type: string
              x-amazon-apigateway-integration:
                timeoutInMillis: 29000
                type: aws
                uri: !Sub 'arn:aws:apigateway:${AWS::Region}:states:action/StartSyncExecution'
                httpMethod: POST
                credentials: !GetAtt ApiStepFunctionsRole.Arn
                requestTemplates:
                  application/json: !Sub |
                    {
                      "stateMachineArn": "${PersonNaturalStateMachineArn}",
                      "input": "$util.escapeJavaScript($input.json('$'))"
                    }
                responses:
                  default:
                    statusCode: '200'
                    responseTemplates:
                      application/json: |                        
                        #set($body = $util.parseJson($input.body))
                        
                        #if($body.status == "SUCCEEDED" && $body.output)
                        $body.output
                        #else
                        $util.toJson($body)
                        #end
                      text/plain: |
                        #set($body = $util.parseJson($input.body))
                        
                        #if($body.status == "SUCCEEDED" && $body.output)
                        $body.output
                        #else
                        $util.toJson($body)
                        #end
                      application/x-amz-json-1.0: |
                        #set($body = $util.parseJson($input.body))
                        
                        #if($body.status == "SUCCEEDED" && $body.output)
                        $body.output
                        #else
                        $util.toJson($body)
                        #end
              # responses are defined above (OpenAPI), integration response mapping is under x-amazon-apigateway-integration
          /rick-morty/start:
            post:
              summary: Start Rick and Morty async workflow
              responses:
                '200':
                  description: Execution started successfully
                  content:
                    application/json:
                      schema:
                        type: object
                        properties:
                          requestId:
                            type: string
                          status:
                            type: string
              x-amazon-apigateway-integration:
                timeoutInMillis: 29000
                type: aws
                uri: !Sub 'arn:aws:apigateway:${AWS::Region}:states:action/StartExecution'
                httpMethod: POST
                credentials: !GetAtt ApiRickMortyRole.Arn
                requestTemplates:
                  application/json: !Sub |
                    #set($requestId = $context.requestId)
                      {
                        "stateMachineArn": "${RickMortyStateMachineArn}",
                        "input": "{ \"requestId\": \"$requestId\", \"characterId\": $input.json('$.characterId') }"
                      }
                responses:
                  default:
                    statusCode: '200'
                    responseTemplates:
                      application/json: |
                        #set($requestId = $context.requestId)
                        {
                          "requestId": "$requestId",
                          "status": "STARTED"
                        }
          /rick-morty/result/{requestId}:
            get:
              summary: Get Rick and Morty async result
              parameters:
                - name: requestId
                  in: path
                  required: true
                  schema:
                    type: string
              responses:
                '200':
                  description: Result retrieved successfully
                  content:
                    application/json:
                      schema:
                        type: object
                '404':
                  description: Result not found
                  content:
                    application/json:
                      schema:
                        type: object
              x-amazon-apigateway-integration:
                timeoutInMillis: 29000
                type: aws
                uri: !Sub 'arn:aws:apigateway:${AWS::Region}:dynamodb:action/GetItem'
                httpMethod: POST
                credentials: !GetAtt ApiRickMortyRole.Arn
                requestTemplates:
                  application/json: !Sub |
                    {
                      "TableName": "${AsyncResultsTableName}",
                      "Key": {
                        "requestId": {
                          "S": "$input.params('requestId')"
                        }
                      }
                    }
                responses:
                  default:
                    statusCode: '200'
                    responseTemplates:
                      application/json: |
                        #set($item = $input.path('$.Item'))
                        #if($item.toString() != "{}")
                        {
                          "requestId": "$item.requestId.S",
                          "status": "$item.status.S",
                          "processed": "$item.processed.S",
                          #if($item.characterId)
                          "characterId": $item.characterId.N,
                          #end
                          #if($item.statusCode)
                          "statusCode": $item.statusCode.N,
                          #end
                          #if($item.characterData)
                          "data": $item.characterData.S,
                          #end
                          #if($item.error)
                          "error": $item.error.S,
                          #end
                          "timestamp": "$item.timestamp.S"
                        }
                        #else
                        #set($context.responseOverride.status = 404)
                        {
                          "error": "Result not found",
                          "requestId": "$input.params('requestId')"
                        }
                        #end
            post:
              summary: Mark Rick and Morty process as completed
              parameters:
                - name: requestId
                  in: path
                  required: true
                  schema:
                    type: string
              responses:
                '200':
                  description: Process marked as completed
                  content:
                    application/json:
                      schema:
                        type: object
                '400':
                  description: Bad Request
                  content:
                    application/json:
                      schema:
                        type: object
                '500':
                  description: Internal Server Error
                  content:
                    application/json:
                      schema:
                        type: object
              x-amazon-apigateway-integration:
                timeoutInMillis: 29000
                type: aws
                uri: !Sub 'arn:aws:apigateway:${AWS::Region}:dynamodb:action/UpdateItem'
                httpMethod: POST
                credentials: !GetAtt ApiRickMortyRole.Arn
                requestTemplates:
                  application/json: !Sub |
                    {
                          "TableName": "${AsyncResultsTableName}",
                          "Key": {
                            "requestId": { "S": "$input.params('requestId')" }
                          },
                          "UpdateExpression": "SET #proc = :val",
                          "ConditionExpression": "attribute_exists(requestId)",
                          "ExpressionAttributeNames": {
                            "#proc": "processed"
                          },
                          "ExpressionAttributeValues": {
                            ":val": { "S": "true" }
                          }
                        }
                responses:
                  default:
                    statusCode: '200'
                    responseTemplates:
                      application/json: |
                        {
                          "requestId": "$input.params('requestId')",
                          "message": "Process marked as completed"
                        }
                  4\d{2}:
                    statusCode: '400'
                    responseTemplates:
                      application/json: |
                        #set($context.responseOverride.status = 400)
                        {
                          "error": "Bad Request",
                          "message": "Update failed. Check if requestId exists.",
                          "requestId": "$input.params('requestId')"
                        }
                  5\d{2}:
                    statusCode: '500'
                    responseTemplates:
                      application/json: |
                        #set($context.responseOverride.status = 500)
                        {
                          "error": "Internal Server Error",
                          "requestId": "$input.params('requestId')"
                        }
          /weather/start:
            post:
              summary: Start Weather Approval Orchestrator
              responses:
                '200':
                  description: Execution started successfully
                  content:
                    application/json:
                      schema:
                        type: object
              x-amazon-apigateway-integration:
                timeoutInMillis: 29000
                type: aws
                uri: !Sub 'arn:aws:apigateway:${AWS::Region}:states:action/StartExecution'
                httpMethod: POST
                credentials: !GetAtt ApiWeatherRole.Arn
                requestTemplates:
                  application/json: !Sub |
                    #set($rid = $context.requestId)
                    {
                      "stateMachineArn": "${WeatherOrchestratorArn}",
                      "input": "{ 
                        \"requestId\": \"$rid\", 
                        \"city\": \"$input.json('$.city')\",
                        \"latitude\": $input.json('$.latitude'),
                        \"longitude\": $input.json('$.longitude')
                      }"
                    }
                responses:
                  default:
                    statusCode: '200'
                    responseTemplates:
                      application/json: |
                        #set($requestId = $context.requestId)
                        {
                          "requestId": "$requestId",
                          "status": "STARTED"
                        }

          /weather/confirm/{requestId}:
            post:
              summary: Confirm Weather Process
              parameters:
                - name: requestId
                  in: path
                  required: true
                  schema:
                    type: string
              responses:
                '200':
                  description: Process confirmed
                  content:
                    application/json:
                      schema:
                        type: object
              x-amazon-apigateway-integration:
                timeoutInMillis: 29000
                type: aws
                uri: !Sub 'arn:aws:apigateway:${AWS::Region}:dynamodb:action/UpdateItem'
                httpMethod: POST
                credentials: !GetAtt ApiWeatherRole.Arn
                requestTemplates:
                  application/json: !Sub |
                    {
                      "TableName": "${AsyncResultsTableName}",
                      "Key": {
                        "requestId": { "S": "$input.params('requestId')" }
                      },
                      "UpdateExpression": "SET approved = :true, status = :approved",
                      "ConditionExpression": "attribute_exists(requestId)",
                      "ExpressionAttributeValues": {
                        ":true": { "S": "true" },
                        ":approved": { "S": "APPROVED" }
                      }
                    }
                responses:
                  default:
                    statusCode: '200'
                    responseTemplates:
                      application/json: |
                        {
                          "requestId": "$input.params('requestId')",
                          "message": "Process confirmed"
                        }
                  4\d{2}:
                    statusCode: '400'
                    responseTemplates:
                      application/json: |
                        #set($context.responseOverride.status = 400)
                        {
                          "error": "Bad Request",
                          "message": "Update failed. Check if requestId exists.",
                          "requestId": "$input.params('requestId')"
                        }

        components:
          securitySchemes:
            CognitoAuthorizer:
              type: apiKey
              name: Authorization
              in: header
              x-amazon-apigateway-authtype: cognito_user_pools
              x-amazon-apigateway-authorizer:
                providerARNs:
                  - !Ref UserPoolArn
                type: cognito_user_pools
        x-amazon-apigateway-cors:
          allowOrigins:
            - '*'
          allowMethods:
            - GET
            - POST
            - OPTIONS
          allowHeaders:
            - Authorization
            - Content-Type
      TracingEnabled: true
      Tags:
        Name: !Sub 'bancow-${Environment}-api'
        Environment: !Ref Environment

  # Lambda Function - Service Function (v1)
  # NOTE: Initially deployed with InlineCode placeholder to allow infrastructure deployment
  # before the app artifact exists in S3. After the app workflow runs and uploads the artifact,
  # uncomment CodeUri and comment out InlineCode, then redeploy.
  ServiceFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'bancow-${Environment}-service-fn'
      Runtime: nodejs22.x
      Handler: index.main
      CodeUri:
        Bucket: !Ref LambdaArtifactBucket
        Key: !If
          - UseExplicitLambdaArtifactKey
          - !Ref LambdaArtifactKey
          - 'lambda/bancow-service.zip'
      Role: !Ref LambdaExecutionRoleArn
      Timeout: 30
      MemorySize: 512
      VpcConfig:
        SubnetIds: !Ref PrivateSubnetIds
        SecurityGroupIds:
          - !Ref LambdaSecurityGroupId
      Environment:
        Variables:
          ARTIFACT_HASH: !Ref ArtifactHash
          ENVIRONMENT: !Ref Environment
          LOG_LEVEL: !Ref LogLevel
          SOAP_ENDPOINT: !FindInMap [ SoapConfig, !Ref Environment, SOAPENDPOINT ]
          ALLOW_INSECURE_TLS: !FindInMap [ SoapConfig, !Ref Environment, ALLOWINSECURETLS ]
          SOAP_CREDENTIALS_SECRET_ARN: !Ref SoapCredentialsArn

  # Lambda Permissions to allow API Gateway to invoke the function
  ServiceFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt ServiceFunction.Arn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiGateway}/*/*/person/*'

  # WAF Web ACL Association
  WebACLAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    DependsOn:
      - ApiGateway
      - ServiceFunction
      - ApiGatewayStage
    Properties:
      ResourceArn: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}::/restapis/${ApiGateway}/stages/${Environment}'
      WebACLArn: !Ref WebACLArn


Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub 'https://${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com/${Environment}'
    Export:
      Name: !Sub 'bancow-${Environment}-api-url'

  ApiId:
    Description: API Gateway ID
    Value: !Ref ApiGateway
    Export:
      Name: !Sub 'bancow-${Environment}-api-id'

  UserPoolArn:
    Description: Cognito User Pool ARN
    Value: !Ref UserPoolArn
    Export:
      Name: !Sub 'bancow-${Environment}-user-pool-arn'

  ServiceFunctionArn:
    Description: Lambda function ARN
    Value: !GetAtt ServiceFunction.Arn
    Export:
      Name: !Sub 'bancow-${Environment}-service-fn-arn'

  ServiceFunctionName:
    Description: Lambda function name
    Value: !Ref ServiceFunction
    Export:
      Name: !Sub 'bancow-${Environment}-service-fn-name'

