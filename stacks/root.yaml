AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >-
  BANCOW Infrastructure - Root Orchestrator Stack
  This stack orchestrates all infrastructure layers without creating resources directly.

Parameters:
  Environment:
    Type: String
    Description: Environment name
    AllowedValues: [dev, uat, prod]
  
  # Network parameters (manual or imported)
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC ID where resources will be deployed
  
  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Private subnet IDs for Lambda functions
  
  LambdaSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security Group ID for Lambda functions
  
  # App parameters
  LambdaArtifactBucket:
    Type: String
    Description: S3 bucket containing Lambda deployment artifacts
  
  LambdaArtifactKey:
    Type: String
    Description: S3 key for Lambda deployment package

  # Async parameters
  AsyncArtifactBucket:
    Type: String
    Description: S3 bucket containing async deployment artifacts
  
  AsyncArtifactKey:
    Type: String
    Description: S3 key for async deployment package

  LogLevel:
    Type: String
    Default: INFO
    AllowedValues: [DEBUG, INFO, WARN, ERROR]
    Description: Application log level

Resources:
  # Network Stack (or just parameters if using existing VPC)
  # In this case, network is managed externally, so we skip this stack
  
  # Security Stack - IAM Roles, Cognito, WAF
  SecurityStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: security.yaml
      Parameters:
        Environment: !Ref Environment
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Stack
          Value: Security
  
  # Data Stack - S3, Secrets Manager
  DataStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: data.yaml
      Parameters:
        Environment: !Ref Environment
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Stack
          Value: Data
  
  # App Stack - Lambda, API Gateway
  AppStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: app.yaml
      Parameters:
        Environment: !Ref Environment
        VpcId: !Ref VpcId
        PrivateSubnetIds: !Join [',', !Ref PrivateSubnetIds]
        LambdaSecurityGroupId: !Ref LambdaSecurityGroupId
        LambdaExecutionRoleArn: !GetAtt SecurityStack.Outputs.LambdaExecutionRoleArn
        SoapCredentialsArn: !GetAtt DataStack.Outputs.SoapCredentialsArn
        UserPoolArn: !GetAtt SecurityStack.Outputs.UserPoolArn
        WebACLArn: !GetAtt SecurityStack.Outputs.WebACLArn
        LambdaArtifactBucket: !Ref LambdaArtifactBucket
        LambdaArtifactKey: !Ref LambdaArtifactKey
        LogLevel: !Ref LogLevel
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Stack
          Value: App
  
  # Async Stack - Step Functions orchestration
  AsyncStack:
    Type: AWS::CloudFormation::Stack
    DependsOn:
      - SecurityStack
      - DataStack
      - AppStack
    Properties:
      TemplateURL: async.yaml
      Parameters:
        Environment: !Ref Environment
        VpcId: !Ref VpcId
        PrivateSubnetIds: !Join [',', !Ref PrivateSubnetIds]
        LambdaSecurityGroupId: !Ref LambdaSecurityGroupId
        LambdaExecutionRoleArn: !GetAtt SecurityStack.Outputs.LambdaExecutionRoleArn
        SoapCredentialsArn: !GetAtt DataStack.Outputs.SoapCredentialsArn
        AsyncArtifactBucket: !Ref AsyncArtifactBucket
        AsyncArtifactKey: !Ref AsyncArtifactKey
        LogLevel: !Ref LogLevel
        ApiGatewayId: !GetAtt AppStack.Outputs.ApiId
        UserPoolArn: !GetAtt AppStack.Outputs.UserPoolArn
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Stack
          Value: Async

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !GetAtt AppStack.Outputs.ApiUrl
  
  CognitoUserPoolClientId:
    Description: Cognito User Pool Client ID
    Value: !GetAtt SecurityStack.Outputs.UserPoolClientId
  
  CognitoAuthDomain:
    Description: Cognito Auth Domain
    Value: !GetAtt SecurityStack.Outputs.CognitoAuthDomain
  
  CognitoTokenUrl:
    Description: Cognito Token URL
    Value: !GetAtt SecurityStack.Outputs.CognitoTokenUrl
  
  # Async Stack Outputs
  V2StarterFunctionArn:
    Description: ARN of the v2 Starter Lambda function
    Value: !GetAtt AsyncStack.Outputs.StarterFunctionArn
  
  V2StarterFunctionName:
    Description: Name of the v2 Starter Lambda function
    Value: !GetAtt AsyncStack.Outputs.StarterFunctionName
  
  V2StateMachineArn:
    Description: ARN of the v2 Process X State Machine
    Value: !GetAtt AsyncStack.Outputs.StateMachineArn
  
  V2StateMachineName:
    Description: Name of the v2 Process X State Machine
    Value: !GetAtt AsyncStack.Outputs.StateMachineName
