name: Deploy BANCOW Infrastructure

on:
  push:
    branches:
      - prod
      - nonprod
      - dev
  pull_request:
    branches:
      - prod
      - nonprod
      - dev
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        type: choice
        options:
          - dev
          - uat
          - prod

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  NODE_VERSION: '22'
  PYTHON_VERSION: '3.11'

jobs:
  # Determine environment from branch or input
  determine-environment:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
      should-deploy: ${{ steps.set-env.outputs.should-deploy }}
    steps:
      - name: Determine environment
        id: set-env
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "environment=${{ inputs.environment }}" >> $GITHUB_OUTPUT
            echo "should-deploy=true" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/prod" ]]; then
            echo "environment=prod" >> $GITHUB_OUTPUT
            echo "should-deploy=true" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/nonprod" ]]; then
            echo "environment=uat" >> $GITHUB_OUTPUT
            echo "should-deploy=true" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/dev" ]]; then
            echo "environment=dev" >> $GITHUB_OUTPUT
            echo "should-deploy=true" >> $GITHUB_OUTPUT
          else
            echo "environment=dev" >> $GITHUB_OUTPUT
            echo "should-deploy=false" >> $GITHUB_OUTPUT
          fi

  # Step 1: Deploy CDK Base Infrastructure
  deploy-cdk:
    name: Deploy CDK Base Stack
    runs-on: ubuntu-latest
    needs: determine-environment
    if: needs.determine-environment.outputs.should-deploy == 'true'
    environment: ${{ needs.determine-environment.outputs.environment }}
    defaults:
      run:
        working-directory: ./cdk
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: cdk/package-lock.json

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-CDK-Deploy

      - name: Install CDK dependencies
        run: npm ci

      - name: CDK Synth
        run: npm run synth -- -c environment=${{ needs.determine-environment.outputs.environment }}

      - name: CDK Diff
        run: npm run diff -- -c environment=${{ needs.determine-environment.outputs.environment }}
        continue-on-error: true

      - name: CDK Deploy
        run: |
          npm run deploy -- \
            -c environment=${{ needs.determine-environment.outputs.environment }} \
            -c githubOrg=${{ github.repository_owner }} \
            -c githubRepo=${{ github.event.repository.name }} \
            --require-approval never

      - name: Verify SSM Parameters
        run: |
          ENV=${{ needs.determine-environment.outputs.environment }}
          echo "Verifying SSM parameters for environment: $ENV"
          aws ssm get-parameters-by-path \
            --path "/bancow/$ENV/" \
            --recursive \
            --query "Parameters[].Name" \
            --output table

  # Step 2: Deploy SAM Application Resources
  deploy-sam:
    name: Deploy SAM Application Stack
    runs-on: ubuntu-latest
    needs: [determine-environment, deploy-cdk]
    if: needs.determine-environment.outputs.should-deploy == 'true'
    environment: ${{ needs.determine-environment.outputs.environment }}
    defaults:
      run:
        working-directory: ./sam
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-SAM-Deploy

      - name: SAM Validate
        run: sam validate --template resources/root.yaml --lint

      - name: SAM Build
        run: sam build --template resources/root.yaml --use-container

      - name: SAM Deploy
        run: |
          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --config-env ${{ needs.determine-environment.outputs.environment }} \
            --no-fail-on-empty-changeset \
            --stack-name bancow-${{ needs.determine-environment.outputs.environment }}-app

      - name: Get API Gateway URL
        id: get-api-url
        run: |
          API_URL=$(aws cloudformation describe-stacks \
            --stack-name bancow-${{ needs.determine-environment.outputs.environment }}-app \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" \
            --output text)
          echo "api-url=$API_URL" >> $GITHUB_OUTPUT
          echo "API Gateway URL: $API_URL"

      - name: Test API Health Endpoint
        run: |
          sleep 10
          API_URL="${{ steps.get-api-url.outputs.api-url }}"
          if [ -n "$API_URL" ]; then
            curl -f "$API_URL/health" || echo "Health check failed or endpoint not ready"
          fi

  # Notification job
  notify:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [determine-environment, deploy-cdk, deploy-sam]
    if: always() && needs.determine-environment.outputs.should-deploy == 'true'
    steps:
      - name: Deployment Summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: ${{ needs.determine-environment.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- **CDK Status**: ${{ needs.deploy-cdk.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **SAM Status**: ${{ needs.deploy-sam.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
