name: Deploy BANCOW Infrastructure

on:
  push:
    branches: [dev, nonprod, prod]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        type: choice
        options: [dev, uat, prod]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  NODE_VERSION: '22'
  PYTHON_VERSION: '3.11'

jobs:
  determine-environment:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}
    steps:
      - id: env
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "environment=${{ inputs.environment }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/prod" ]]; then
            echo "environment=prod" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/nonprod" ]]; then
            echo "environment=uat" >> $GITHUB_OUTPUT
          else
            echo "environment=dev" >> $GITHUB_OUTPUT
          fi

  deploy:
    runs-on: ubuntu-latest
    needs: determine-environment
    environment: ${{ needs.determine-environment.outputs.environment }}

    steps:
      - uses: actions/checkout@v4

      # ---------- CDK ----------
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy CDK Base Infra
        working-directory: cdk
        run: |
          npm ci
          npm run deploy -- \
            -c environment=${{ needs.determine-environment.outputs.environment }} \
            --require-approval never

      # ---------- SAM ----------
      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Upload SAM templates to S3
        run: |
          aws s3 sync stacks/ s3://${{ vars.TEMPLATES_BUCKET }} \
            --exclude "*" --include "*.yaml" --exclude "root.yaml"

      - name: Load parameters
        id: params
        run: |
          PARAMS=$(cat environments/${{ needs.determine-environment.outputs.environment }}/parameters.json \
            | jq -r '.Parameters | to_entries | map("\(.key)=\(.value)") | join(" ")')
          echo "params=$PARAMS" >> $GITHUB_OUTPUT

      - name: Deploy SAM App
        run: |
          sam deploy \
            --template-file stacks/root.yaml \
            --stack-name bancow-${{ needs.determine-environment.outputs.environment }}-root \
            --region ${{ env.AWS_REGION }} \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM CAPABILITY_AUTO_EXPAND \
            --no-fail-on-empty-changeset \
            --parameter-overrides ${{ steps.params.outputs.params }}

      - name: Smoke test (dev only)
        if: needs.determine-environment.outputs.environment == 'dev'
        run: |
          API_URL=$(aws cloudformation describe-stacks \
            --stack-name bancow-dev-root \
            --query 'Stacks[0].Outputs[?OutputKey==`ApiUrl`].OutputValue' \
            --output text)
          curl -f "$API_URL/health"

      - name: Summary
        run: |
          echo "## 🚀 Deployment completed" >> $GITHUB_STEP_SUMMARY
          echo "- Environment: ${{ needs.determine-environment.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
