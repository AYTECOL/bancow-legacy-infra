name: Infrastructure Deployment

on:
  push:
    branches:
      - dev
      - nonprod
      - master
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        type: choice
        options:
          - dev
          - uat
          - prod
      artifact_version:
        description: 'Lambda artifact version to deploy'
        required: true
        type: string
        default: 'latest'

permissions:
  id-token: write
  contents: read

jobs:
  deploy-dev:
    name: Deploy to DEV
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/dev') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev')
    runs-on: ubuntu-latest
    environment: dev
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set artifact version
        id: set-version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ARTIFACT_VERSION=${{ github.event.inputs.artifact_version }}" >> $GITHUB_ENV
          else
            echo "ARTIFACT_VERSION=${{ github.sha }}" >> $GITHUB_ENV
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: us-east-1

      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Update artifact version in parameters
        run: |
          jq ".Parameters.LambdaArtifactVersion = \"${{ env.ARTIFACT_VERSION }}\"" \
            environments/dev/parameters.json > tmp.json && mv tmp.json environments/dev/parameters.json

      - name: Deploy to DEV
        run: |
          jq -r '.Parameters | to_entries | map("\(.key)=\(.value)") | join(" ")' environments/dev/parameters.json > params.txt
          sam deploy \
          --config-file samconfig.toml \
          --config-env dev \
          --template-file stacks/root.yaml \
          --no-fail-on-empty-changeset \
          --role-arn ${{ secrets.CFN_EXECUTION_ROLE_ARN }} \
          --parameter-overrides LambdaArtifactVersion=${{ env.ARTIFACT_VERSION }} $(cat params.txt)

  deploy-uat:
    name: Deploy to UAT
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/nonprod') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'uat')
    runs-on: ubuntu-latest
    environment: uat

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: us-east-1

      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Set artifact version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ARTIFACT_VERSION=${{ github.event.inputs.artifact_version }}" >> $GITHUB_ENV
          else
            echo "ARTIFACT_VERSION=${{ github.sha }}" >> $GITHUB_ENV
          fi

      - name: Deploy to UAT
        run: |
          jq -r '.Parameters | to_entries | map("\(.key)=\(.value)") | join(" ")' environments/uat/parameters.json > params_uat.txt
          sam deploy \
          --config-file samconfig.toml \
          --config-env uat \
          --template-file stacks/root.yaml \
          --no-confirm-changeset \
          --no-fail-on-empty-changeset \
          --role-arn ${{ secrets.CFN_EXECUTION_ROLE_ARN }} \
          --parameter-overrides $(cat params_uat.txt)

  deploy-prod:
    name: Deploy to PROD
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod')
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: us-east-1

      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Set artifact version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ARTIFACT_VERSION=${{ github.event.inputs.artifact_version }}" >> $GITHUB_ENV
          else
            echo "ARTIFACT_VERSION=${{ github.sha }}" >> $GITHUB_ENV
          fi

      - name: Deploy to PROD
        run: |
          jq -r '.Parameters | to_entries | map("\(.key)=\(.value)") | join(" ")' environments/prod/parameters.json > params_prod.txt         
          sam deploy \
          --config-file samconfig.toml \
          --config-env prod \
          --template-file stacks/root.yaml \
          --no-confirm-changeset \
          --no-fail-on-empty-changeset \
          --role-arn ${{ secrets.CFN_EXECUTION_ROLE_ARN }} \
          --parameter-overrides $(cat params_prod.txt)
  notify:
    name: Notify deployment status
    needs: [ deploy-dev, deploy-uat, deploy-prod ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Summary
        run: echo "Deployment process finished."