name: Infrastructure Deployment

on:
  push:
    branches:
      - dev
      - nonprod
      - master
      - feat/step-fn
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        type: choice
        options:
          - dev
          - uat
          - prod

permissions:
  id-token: write
  contents: read

jobs:
  deploy-dev:
    name: Deploy to DEV
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/feat/step-fn') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev')
    runs-on: ubuntu-latest
    environment: dev
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: us-east-1

      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Get artifact hash from S3
        id: get-hash
        run: |
          ARTIFACT_HASH=$(aws s3 cp s3://bancow-artifacts-dev/lambda/bancow-service-hash.txt - 2>/dev/null || true)
          ARTIFACT_HASH=$(echo "$ARTIFACT_HASH" | tr -d '\r\n' | xargs)
          if [[ -z "$ARTIFACT_HASH" || "$ARTIFACT_HASH" == "none" ]]; then
            echo "❌ No se pudo leer un ArtifactHash válido desde s3://bancow-artifacts-dev/lambda/bancow-service-hash.txt"
            exit 1
          fi
          echo "hash=$ARTIFACT_HASH" >> $GITHUB_OUTPUT
          echo "📌 Artifact Hash from S3: $ARTIFACT_HASH"

      - name: Ensure hash-based Lambda artifact exists (DEV)
        run: |
          BUCKET="bancow-artifacts-dev"
          STABLE_KEY="lambda/bancow-service.zip"
          HASH_KEY="lambda/bancow-service-${{ steps.get-hash.outputs.hash }}.zip"

          echo "🔎 Validando artifact por hash: s3://$BUCKET/$HASH_KEY"
          if aws s3api head-object --bucket "$BUCKET" --key "$HASH_KEY" >/dev/null 2>&1; then
            echo "✅ Ya existe el artifact por hash."
          else
            echo "ℹ️ No existe el artifact por hash. Copiando desde el key estable: s3://$BUCKET/$STABLE_KEY"
            aws s3 cp "s3://$BUCKET/$STABLE_KEY" "s3://$BUCKET/$HASH_KEY"
            echo "✅ Artifact copiado a key por hash."
          fi

      - name: Validate Lambda artifact handlers (DEV)
        run: |
          BUCKET="bancow-artifacts-dev"
          HASH_KEY="lambda/bancow-service-${{ steps.get-hash.outputs.hash }}.zip"

          WORKDIR="/tmp/bancow_lambda_artifact"
          rm -rf "$WORKDIR"
          mkdir -p "$WORKDIR/unzipped"

          echo "⬇️ Descargando s3://$BUCKET/$HASH_KEY"
          aws s3 cp "s3://$BUCKET/$HASH_KEY" "$WORKDIR/lambda.zip"

          echo "📦 Descomprimiendo"
          unzip -q "$WORKDIR/lambda.zip" -d "$WORKDIR/unzipped"

          echo "🔍 Verificando exports requeridos"
          node -e 'const h=require("/tmp/bancow_lambda_artifact/unzipped/index.js"); const required=["main","getPhysicalPersonSfn","getAddressesPersonSfn"]; const missing=required.filter(k=>typeof h[k]!=="function"); if(missing.length){ console.error("❌ Handlers faltantes:", missing); console.error("exports:", Object.keys(h)); process.exit(1);} console.log("✅ Artifact OK. exports:", Object.keys(h));'

      - name: Deploy to DEV
        run: |
          STACK_NAME="bancow-dev-infra"
          DEPLOY_BUCKET="bancow-dev-sam-deployment"
          PARAMS=$(jq -r '.Parameters | to_entries | map(select(.key != "ArtifactHash") | select((.value|tostring) != "")) | map("\(.key)=\(.value)") | join(" ")' environments/dev/parameters.json)
          
          sam build --template-file stacks/root.yaml
          
          sam deploy \
          --stack-name $STACK_NAME \
          --s3-bucket $DEPLOY_BUCKET \
          --config-file samconfig.toml \
          --config-env dev \
          --no-fail-on-empty-changeset \
          --on-failure DO_NOTHING \
          --role-arn ${{ secrets.CFN_EXECUTION_ROLE_ARN }} \
          --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM CAPABILITY_AUTO_EXPAND \
          --parameter-overrides \
             ArtifactHash=${{ steps.get-hash.outputs.hash }} \
             $PARAMS

  deploy-uat:
    name: Deploy to UAT
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/nonprod') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'uat')
    runs-on: ubuntu-latest
    environment: uat

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: us-east-1

      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Get artifact hash from S3
        id: get-hash
        run: |
          ARTIFACT_HASH=$(aws s3 cp s3://bancow-artifacts-uat/lambda/bancow-service-hash.txt - 2>/dev/null || true)
          ARTIFACT_HASH=$(echo "$ARTIFACT_HASH" | tr -d '\r\n' | xargs)
          if [[ -z "$ARTIFACT_HASH" || "$ARTIFACT_HASH" == "none" ]]; then
            echo "❌ No se pudo leer un ArtifactHash válido desde s3://bancow-artifacts-uat/lambda/bancow-service-hash.txt"
            exit 1
          fi
          echo "hash=$ARTIFACT_HASH" >> $GITHUB_OUTPUT
          echo "📌 Artifact Hash from S3: $ARTIFACT_HASH"

      - name: Ensure hash-based Lambda artifact exists (UAT)
        run: |
          BUCKET="bancow-artifacts-uat"
          STABLE_KEY="lambda/bancow-service.zip"
          HASH_KEY="lambda/bancow-service-${{ steps.get-hash.outputs.hash }}.zip"

          echo "🔎 Validando artifact por hash: s3://$BUCKET/$HASH_KEY"
          if aws s3api head-object --bucket "$BUCKET" --key "$HASH_KEY" >/dev/null 2>&1; then
            echo "✅ Ya existe el artifact por hash."
          else
            echo "ℹ️ No existe el artifact por hash. Copiando desde el key estable: s3://$BUCKET/$STABLE_KEY"
            aws s3 cp "s3://$BUCKET/$STABLE_KEY" "s3://$BUCKET/$HASH_KEY"
            echo "✅ Artifact copiado a key por hash."
          fi

      - name: Validate Lambda artifact handlers (UAT)
        run: |
          BUCKET="bancow-artifacts-uat"
          HASH_KEY="lambda/bancow-service-${{ steps.get-hash.outputs.hash }}.zip"

          WORKDIR="/tmp/bancow_lambda_artifact"
          rm -rf "$WORKDIR"
          mkdir -p "$WORKDIR/unzipped"

          echo "⬇️ Descargando s3://$BUCKET/$HASH_KEY"
          aws s3 cp "s3://$BUCKET/$HASH_KEY" "$WORKDIR/lambda.zip"

          echo "📦 Descomprimiendo"
          unzip -q "$WORKDIR/lambda.zip" -d "$WORKDIR/unzipped"

          echo "🔍 Verificando exports requeridos"
          node -e 'const h=require("/tmp/bancow_lambda_artifact/unzipped/index.js"); const required=["main","getPhysicalPersonSfn","getAddressesPersonSfn"]; const missing=required.filter(k=>typeof h[k]!=="function"); if(missing.length){ console.error("❌ Handlers faltantes:", missing); console.error("exports:", Object.keys(h)); process.exit(1);} console.log("✅ Artifact OK. exports:", Object.keys(h));'

      - name: Deploy to UAT
        run: |
          jq -r '.Parameters | to_entries | map(select(.key != "ArtifactHash") | select((.value|tostring) != "")) | map("\(.key)=\(.value)") | join(" ")' environments/uat/parameters.json > params_uat.txt
          sam deploy \
          --config-file samconfig.toml \
          --config-env uat \
          --template-file stacks/root.yaml \
          --no-confirm-changeset \
          --no-fail-on-empty-changeset \
          --role-arn ${{ secrets.CFN_EXECUTION_ROLE_ARN }} \
          --parameter-overrides ArtifactHash=${{ steps.get-hash.outputs.hash }} $(cat params_uat.txt)

  deploy-prod:
    name: Deploy to PROD
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod')
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: us-east-1

      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Get artifact hash from S3
        id: get-hash
        run: |
          ARTIFACT_HASH=$(aws s3 cp s3://bancow-artifacts-prod/lambda/bancow-service-hash.txt - 2>/dev/null || true)
          ARTIFACT_HASH=$(echo "$ARTIFACT_HASH" | tr -d '\r\n' | xargs)
          if [[ -z "$ARTIFACT_HASH" || "$ARTIFACT_HASH" == "none" ]]; then
            echo "❌ No se pudo leer un ArtifactHash válido desde s3://bancow-artifacts-prod/lambda/bancow-service-hash.txt"
            exit 1
          fi
          echo "hash=$ARTIFACT_HASH" >> $GITHUB_OUTPUT
          echo "📌 Artifact Hash from S3: $ARTIFACT_HASH"

      - name: Ensure hash-based Lambda artifact exists (PROD)
        run: |
          BUCKET="bancow-artifacts-prod"
          STABLE_KEY="lambda/bancow-service.zip"
          HASH_KEY="lambda/bancow-service-${{ steps.get-hash.outputs.hash }}.zip"

          echo "🔎 Validando artifact por hash: s3://$BUCKET/$HASH_KEY"
          if aws s3api head-object --bucket "$BUCKET" --key "$HASH_KEY" >/dev/null 2>&1; then
            echo "✅ Ya existe el artifact por hash."
          else
            echo "ℹ️ No existe el artifact por hash. Copiando desde el key estable: s3://$BUCKET/$STABLE_KEY"
            aws s3 cp "s3://$BUCKET/$STABLE_KEY" "s3://$BUCKET/$HASH_KEY"
            echo "✅ Artifact copiado a key por hash."
          fi

      - name: Validate Lambda artifact handlers (PROD)
        run: |
          BUCKET="bancow-artifacts-prod"
          HASH_KEY="lambda/bancow-service-${{ steps.get-hash.outputs.hash }}.zip"

          WORKDIR="/tmp/bancow_lambda_artifact"
          rm -rf "$WORKDIR"
          mkdir -p "$WORKDIR/unzipped"

          echo "⬇️ Descargando s3://$BUCKET/$HASH_KEY"
          aws s3 cp "s3://$BUCKET/$HASH_KEY" "$WORKDIR/lambda.zip"

          echo "📦 Descomprimiendo"
          unzip -q "$WORKDIR/lambda.zip" -d "$WORKDIR/unzipped"

          echo "🔍 Verificando exports requeridos"
          node -e 'const h=require("/tmp/bancow_lambda_artifact/unzipped/index.js"); const required=["main","getPhysicalPersonSfn","getAddressesPersonSfn"]; const missing=required.filter(k=>typeof h[k]!=="function"); if(missing.length){ console.error("❌ Handlers faltantes:", missing); console.error("exports:", Object.keys(h)); process.exit(1);} console.log("✅ Artifact OK. exports:", Object.keys(h));'

      - name: Deploy to PROD
        run: |
          jq -r '.Parameters | to_entries | map(select(.key != "ArtifactHash") | select((.value|tostring) != "")) | map("\(.key)=\(.value)") | join(" ")' environments/prod/parameters.json > params_prod.txt         
          sam deploy \
          --config-file samconfig.toml \
          --config-env prod \
          --template-file stacks/root.yaml \
          --no-confirm-changeset \
          --no-fail-on-empty-changeset \
          --role-arn ${{ secrets.CFN_EXECUTION_ROLE_ARN }} \
          --parameter-overrides ArtifactHash=${{ steps.get-hash.outputs.hash }} $(cat params_prod.txt)
  notify:
    name: Notify deployment status
    needs: [ deploy-dev, deploy-uat, deploy-prod ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Summary
        run: echo "Deployment process finished."